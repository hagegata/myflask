name: Docker Build

on:
  push:
    branches: [ main ]

permissions:
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myflask-web .

      - name: Start services with Docker Compose
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services and test
        run: |
          sleep 20
          curl --fail http://localhost:5000/ || exit 1

      - name: Log in to Github Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/myflask-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag myflask-web $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

      - name: Sign image with Cosign
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          IMAGE_ID=ghcr.io/${{ github.repository }}/myflask-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker run --rm -v $PWD:/workspace -w /workspace \
            gcr.io/projectsigstore/cosign:v2.4.3 \
            sign --key cosign.key --yes ${IMAGE_ID}:latest

      - name: Verify image signature
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/myflask-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker run --rm -v $PWD:/workspace -w /workspace \
            gcr.io/projectsigstore/cosign:v2.4.3 \
            verify --key cosign.pub ${IMAGE_ID}:latest
      
      - name: Scan image with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL --exit-code 1 myflask-web
